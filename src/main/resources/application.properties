spring.application.name=spring_security_exercise

# Database Configuration
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=sahil
spring.datasource.password=1234
spring.datasource.url=jdbc:mysql://localhost:3306/spring_security
spring.jpa.show-sql=true

# Oauth2 Configuration
spring.security.oauth2.client.registration.google.client-id={client-id}
spring.security.oauth2.client.registration.google.client-secret={client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={redirect-uri}